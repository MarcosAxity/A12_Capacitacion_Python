name: CI

# Pipeline de Integración Continua del servicio Orders.
# Se ejecuta en cada push y pull request contra main/develop.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check src tests

  typecheck:
    name: Tipado estático (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: mypy src

  test:
    name: Pruebas (unit, contract, integration, e2e)
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Ejecutar suite completa con cobertura
        run: |
          pytest -v \
            --cov=src/orders \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=85
      - name: Publicar reporte de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  migrations:
    name: Validar migraciones Alembic
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Upgrade y downgrade contra SQLite limpio
        run: |
          export ORDERS_DATABASE_URL="sqlite+aiosqlite:///./ci_migration_check.db"
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

  dependency-audit:
    name: Auditoría de dependencias (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Escanear requirements.txt en busca de CVEs conocidos
        run: pip-audit -r requirements.txt

  docker-build:
    name: Build de imagen Docker (multistage)
    runs-on: ubuntu-latest
    needs: [test, migrations, dependency-audit]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (sin push, solo validación del Dockerfile)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: orders-service:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
